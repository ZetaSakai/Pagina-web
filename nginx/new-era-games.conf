# Nginx configuration for New Era Games
# TLS termina en Nginx y reenvía tráfico a Flask en 8080.
# Los certificados se esperan en /etc/ssl/new-era-games/.

server {
    listen 80;
    listen [::]:80;
    server_name _ newera-games.servegame.com new-era-games.ddns.net *.ddns.net;

    # Logging
    access_log /var/log/nginx/new-era-games-access.log;
    error_log /var/log/nginx/new-era-games-error.log;

    # Client body size for uploads (2GB max like Flask)
    client_max_body_size 2G;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _ newera-games.servegame.com new-era-games.ddns.net *.ddns.net;

    # Logging
    access_log /var/log/nginx/new-era-games-access.log;
    error_log /var/log/nginx/new-era-games-error.log;

    # Client body size for uploads (2GB max like Flask)
    client_max_body_size 2G;

    ssl_certificate /etc/ssl/new-era-games/fullchain.pem;
    ssl_certificate_key /etc/ssl/new-era-games/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NewEraTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        # Proxy a Flask app corriendo en 127.0.0.1:8080
        proxy_pass http://127.0.0.1:8080;

        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare IP (si usas Cloudflare proxy)
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeouts para operaciones largas (uploads, descargas)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket support (si se necesita en el futuro)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering desactivado para streaming de descargas
        proxy_buffering off;
    }

    # Estáticos - servir directamente desde Nginx (más rápido)
    location /static {
        alias /app/Pagina-web/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
