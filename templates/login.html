<!DOCTYPE html>

<html>

<head>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Iniciar Sesión</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <style>
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            text-align: center;
            font-family: sans-serif;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .alert-warning {
            color: #856404;
            background-color: #fff3cd;
            border-color: #ffeeba;
        }

        .alert-info {
            color: #0c5460;
            background-color: #d1ecf1;
            border-color: #bee5eb;
        }
    </style>
</head>

<body>

    <div class="flash-container"
        style="position: absolute; top: 80px; width: 100%; z-index: 999; display: flex; flex-direction: column; align-items: center;">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="width: 80%; max-width: 400px;">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <div class="bg-container">
        <div class="btn glass-effect">
            <a href="{{ url_for('index') }}">Volver al Inicio</a>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="card-container">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <h1>Iniciar Sesión</h1>
            <input class="sign" type="email" name="email" id="email" placeholder="Email" required>
            <input class="sign" type="password" name="passwd" id="passwd" placeholder="Contraseña" required>

            <div class="login-actions">
                <input class="glass-effect button" type="submit" value="Iniciar Sesión">
                <p class="register-link"><a class="anim-link pulse" href="{{ url_for('register') }}">No tengo una cuenta
                        :( </a></p>
            </div>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
