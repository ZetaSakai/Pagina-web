        <div class="comments container">
            <h3>Comentarios</h3>
            <div class="comments-grid">
                <div id="comments-list" class="comments-list"></div>
                <form id="comment-form" class="comment-form">
                    <textarea id="comment-text" placeholder="Escribe un comentario..." required></textarea>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button type="submit" id="comment-submit">Enviar</button>
                        <button type="button" id="comment-cancel" style="display:none;background:#444;color:#fff;border-radius:8px;padding:10px 14px;border:none;cursor:pointer;">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            (function(){
                var list = document.getElementById('comments-list');
                var form = document.getElementById('comment-form');
                var textarea = document.getElementById('comment-text');
                function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
                var editIndex = null;
                var submitBtn = document.getElementById('comment-submit');
                var cancelBtn = document.getElementById('comment-cancel');

                function render(){
                    var arr = JSON.parse(localStorage.getItem('comments')||'[]');
                    if(!arr.length){
                        list.innerHTML = '<p>No hay comentarios aún. Sé el primero.</p>';
                        return;
                    }
                    list.innerHTML = arr.map(function(c, i){
                        var text = escapeHtml(c.text);
                        var time = escapeHtml(c.time);
                        return '<div class="comment">'
                            + '<div class="comment-body">' + text + '</div>'
                            + '<div class="comment-meta">' + time + '</div>'
                            + '<div class="comment-actions" style="margin-top:8px;display:flex;gap:8px;">'
                            + '<button class="btn-edit" data-index="' + i + '" style="background:transparent;border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.9);padding:6px 10px;border-radius:6px;cursor:pointer;">Editar</button>'
                            + '<button class="btn-delete" data-index="' + i + '" style="background:transparent;border:1px solid rgba(255,0,200,0.18);color:#ff9fe6;padding:6px 10px;border-radius:6px;cursor:pointer;">Borrar</button>'
                            + '</div>'
                        + '</div>';
                    }).join('');
                }

                form.addEventListener('submit', function(e){
                    e.preventDefault();
                    var arr = JSON.parse(localStorage.getItem('comments')||'[]');
                    var value = textarea.value && textarea.value.trim();
                    if(!value) return;
                    if(editIndex === null){
                        arr.unshift({ text: value, time: new Date().toLocaleString() });
                    } else {
                        arr[editIndex].text = value;
                        arr[editIndex].time = new Date().toLocaleString();
                        editIndex = null;
                        submitBtn.textContent = 'Enviar';
                        cancelBtn.style.display = 'none';
                    }
                    localStorage.setItem('comments', JSON.stringify(arr));
                    textarea.value = '';
                    render();
                });

                list.addEventListener('click', function(e){
                    var btn;
                    if(e.target.closest('.btn-edit')) btn = e.target.closest('.btn-edit');
                    if(e.target.closest('.btn-delete')) btn = e.target.closest('.btn-delete');
                    if(!btn) return;
                    var idx = parseInt(btn.getAttribute('data-index'), 10);
                    var arr = JSON.parse(localStorage.getItem('comments')||'[]');
                    if(btn.classList.contains('btn-delete')){
                        if(!isNaN(idx)){
                            arr.splice(idx, 1);
                            localStorage.setItem('comments', JSON.stringify(arr));
                            if(editIndex === idx){ editIndex = null; textarea.value=''; submitBtn.textContent='Enviar'; cancelBtn.style.display='none'; }
                            render();
                        }
                        return;
                    }
                    if(btn.classList.contains('btn-edit')){
                        if(!isNaN(idx) && arr[idx]){
                            editIndex = idx;
                            textarea.value = arr[idx].text;
                            submitBtn.textContent = 'Guardar';
                            cancelBtn.style.display = 'inline-block';

                            textarea.scrollIntoView({behavior:'smooth',block:'center'});
                        }
                    }
                });

                cancelBtn.addEventListener('click', function(){
                    editIndex = null;
                    textarea.value = '';
                    submitBtn.textContent = 'Enviar';
                    cancelBtn.style.display = 'none';
                });
                render();
            })();
        </script>
